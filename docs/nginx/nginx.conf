# Рекомендована конфігурація Nginx для OkayCMS. Це не готове фінальне
# налаштування сервера — за тоншим тюнінгом зверніться до системного
# адміністратора.
#
# Файл тримається в синхроні з dev/config/nginx/templates/default.conf.template
# (перевіряється tests/Security/PublicSurfaceTest.php). Відмінності лише в
# тому, що специфічне для контейнерів: там ${VIRTUAL_HOST}, ${FASTCGI},
# default_server і логи в stdout, тут — плейсхолдери й файли.
#
# ─────────────────────────── Білий список ───────────────────────────
#
# Корінь сайту — усе дерево застосунку. Конфіг побудований як білий список:
# перелічує те, що віддається, а не те, що заборонено. Чорний список тут
# неповний за побудовою — будь-який новий файл у корені (composer.json,
# vendor/composer/installed.json, ./ok, дамп бази) віддавався б за
# замовчуванням, а PHP виконувався б будь-де, де лежить .php, включно зі
# скомпільованими шаблонами Smarty.
#
# Тримається все на одному рядку:
#
#     location / { try_files /does_not_exist /index.php?$args; }
#
# Кореневий location НЕ пробує віддати файл з диска ($uri тут навмисно немає),
# тож усе, що не дозволене явно нижче, іде у фронт-контролер і отримує 404
# застосунку.
#
# Правило додавання: щоб опублікувати нове дерево статики, потрібен явний
# location. Щоб щось приховати — не потрібно нічого.

server {
    listen 80;
    server_name DOMAIN_SERVER_NAME;

    #add_header Strict-Transport-Security "max-age=31536000;";

    # Корінь — каталог, у який розгорнуто OkayCMS.
    set $root_path /var/www/html;
    root $root_path;

    charset off;
    index index.php;
    disable_symlinks if_not_owner from=$root_path;

    # Версія nginx у заголовку Server і на сторінках помилок — безкоштовна
    # підказка для добору відомих вразливостей.
    server_tokens off;

    access_log /var/log/nginx/okaycms.access.log;
    error_log  /var/log/nginx/okaycms.error.log;

    gzip on;
    gzip_comp_level 9;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;
    gzip_vary on;

    client_max_body_size 100M;

    if ($host ~* ^www\.(.*)$) {
        return 301 https://$server_name$request_uri;
    }

    if ($request_uri ~* "^(.*/)index\.php$") {
        return 301 $1;
    }

    if ($request_uri ~* "^(.*/)index\.html") {
        return 301 $1;
    }

    # ─────────────────────── Статика кореня ───────────────────────
    # Єдині файли, які віддаються з кореня. Усе інше там — composer.json,
    # phpunit.xml, ok, README.md, дампи бази — не є застосунковими шляхами.

    location = /robots.txt {
        access_log off;
    }

    # Стандартний шлях ACME-валідації (Let's Encrypt).
    location ^~ /.well-known/ {
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Дерево залежностей. Після інверсії воно й так недосяжне — під нього
    # немає жодного дозволу, — але правило лишається явним: ^~ виграє в будь-якої
    # регулярки, яку сюди додадуть пізніше, тож vendor/ не відкриється випадково
    # разом із новим дозволом «усі .js» чи «усі .css».
    location ^~ /vendor/ {
        return 404;
    }

    # ─────────────────────── Дерева статики ───────────────────────
    # Дозвіл описує і директорію, і розширення. Одного розширення мало:
    # у теми поруч із css/ лежать html/ з шаблонами, lang/ і js.php.

    location ~ ^/design/[^/]+/(css|js|images|fonts)/.+\.(css|js|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        access_log off;
        expires max;
        add_header Cache-Control public;
        add_header Access-Control-Allow-Origin *;
    }

    # Прев'ю теми — перемикач тем в адмінці бере його прямо звідси.
    location ~ ^/design/[^/]+/preview\.(png|jpe?g)$ {
        access_log off;
        expires max;
    }

    # Скомпільовані бандли css/js. Саме (css|js)/, а не весь cache/: поруч
    # лежить cache/codes/ і .map-файли з вихідними текстами бібліотек.
    location ~ ^/cache/(css|js)/[^/]+\.(css|js)$ {
        access_log off;
        expires max;
        add_header Cache-Control public;
        add_header Access-Control-Allow-Origin *;
    }

    location ~ ^/js_libraries/.+\.(css|js|map|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
        access_log off;
        expires max;
        add_header Cache-Control public;
        add_header Access-Control-Allow-Origin *;
    }

    # Асети модулів: шаблони адмінки беруть картинки й css прямо з
    # Okay/Modules/. Решта дерева Okay/ — вихідний код — не віддається.
    location ~ ^/Okay/Modules/[^/]+/[^/]+/(Backend/)?design/.+\.(css|js|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
        access_log off;
        expires max;
    }

    # Прев'ю модуля лежить у його корені, а не під design/ — сторінка «Модулі»
    # в адмінці бере картинку саме звідти.
    location ~ ^/Okay/Modules/[^/]+/[^/]+/preview\.(png|jpe?g)$ {
        access_log off;
        expires max;
    }

    # Завантаження файлового менеджера. originals/ — вихідні файли до ресайзу,
    # вони не публічні. Перелік розширень навмисно вузький: усе, що браузер
    # рендерить як HTML або віддає на виконання, тут дало б stored XSS чи гірше
    # на домені магазину.
    #
    # try_files з переходом на index.php обов'язковий: files/resized/ — це
    # маршрут, зменшені копії створюються на перший запит. Жорсткий 404 тут
    # ламав би кожну ще не згенеровану картинку.
    location ~ ^/files/(?!originals/).+\.(png|jpe?g|gif|svg|webp|ico|pdf|zip|xlsx?|docx?|csv|mp3|mp4|ogg|webm)$ {
        try_files $uri /index.php?$args;
        access_log off;
        expires max;
        add_header Cache-Control public;
    }

    # ───────────────────────── Адмінка ─────────────────────────

    location = /admin {
        rewrite /admin /backend/ redirect;
    }

    location ^~ /backend/ {
        # Скомпільовані Smarty-шаблони адмінки — не точки входу. Кожен із них
        # виконувався як PHP і давав 500 із записом у лог.
        location ~ ^/backend/design/compiled/ {
            return 404;
        }

        location ~ ^/backend/lang/ {
            return 404;
        }

        # Конфіг файлового менеджера — облікові дані й шляхи.
        location ~ ^/backend/design/js/filemanager/config/ {
            return 404;
        }

        # PHP під backend/design/ виконується лише у двох деревах — це справжні
        # точки входу. js.php і css.php поруч із ними лише включаються з коду,
        # по HTTP їх ніхто не запитує.
        location ~ ^/backend/design/(?!js/(filemanager|admintooltip)/).*\.php$ {
            return 404;
        }

        location = /backend/design/js/admintooltip/admintooltip.js {
            rewrite ^(/backend/design/js/admintooltip)/admintooltip\.js$ $1/admintooltip.php break;
            try_files /does_not_exist @php;
        }

        location ^~ /backend/files/ {
            rewrite ^(/backend/files)/export/(.+)\.csv$ $1/index.php?file=$2&folder=export&ext=csv break;
            rewrite ^(/backend/files)/export_users/(.+)\.csv$ $1/index.php?file=$2&folder=export_users&ext=csv break;
            rewrite ^(/backend/files)/import/(.+)\.csv$ $1/index.php?file=$2&folder=import&ext=csv break;
            rewrite ^(/backend/files)/watermark/(.+)\.(png|jpg|jpeg|gif|tif|bmp|ico)$ $1/index.php?file=$2&folder=watermark&ext=$3 break;
            rewrite ^(\w+)$ /backend/files/index.php?file= break;
            try_files /does_not_exist @php;
        }

        location ~ \.ph(p\d*|tml)$ {
            try_files /does_not_exist @php;
        }

        # Статика адмінки та її фронт-контролер.
        try_files $uri $uri/ /backend/index.php?$args;
    }

    # ──────────────────── Фронт-контролер вітрини ────────────────────

    location = /index.php {
        try_files /does_not_exist @php;
    }

    # $uri тут немає навмисно — див. коментар угорі файлу. Це і є білий список:
    # усе, що не дозволене вище, сюди й потрапляє, і файл з диска не віддається.
    location / {
        try_files /does_not_exist /index.php?$args;
    }

    location @php {
        fastcgi_pass php-fpm:9000;
        #fastcgi_pass unix:/run/php-fpm/okaycms.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_param DOCUMENT_ROOT $root_path;
        fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Точна версія PHP у кожній відповіді. Джерело — expose_php у php.ini;
        # це другий рубіж на випадок, якщо там його не вимкнено.
        fastcgi_hide_header X-Powered-By;
        include fastcgi_params;
    }
}
