name: Release

on:
  push:
    tags:
      - 'okaycms-fork/v*'
  # Тег, який ставить tag-release.yml через GITHUB_TOKEN, не породжує
  # push-подію для інших workflow (захист GitHub від рекурсії), тому
  # tag-release.yml викликає цей workflow напряму, з ref на щойно
  # створений тег.
  workflow_dispatch:

# Кожна джоба отримує лише те, що їй треба: test лише читає, публікацію
# релізу робить тільки build-and-release.
permissions:
  contents: read

jobs:
  # ci.yml не оголошує `on: workflow_call`, тож викликати його як reusable
  # workflow не можна. Чіпати спільний ci.yml заради цього — поза межами
  # задачі, тож тестова джоба тут — копія `tests` з ci.yml (без static-analysis/
  # secrets/smoke: реліз блокує лише той самий набір кроків, що й `tests`).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    # Не "PHP X.Y", як у ci.yml: на реліз-коміті в main осідають check-run'и
    # і від ci.yml, і звідси; однакові імена змішали б їх із required checks.
    name: Release tests (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: simplexml, xmlreader, pdo, json, curl, mbstring, zip, gd, xsl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: composer audit --locked --abandoned=report

      - name: PHPCompatibility
        run: vendor/bin/phpcs -q

      - name: PHPUnit
        run: vendor/bin/phpunit

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Потрібна повна історія: перевірка нижче з'ясовує, чи тег
          # досяжний з main.
          fetch-depth: 0

      - name: Validate tag and extract fork version
        id: version
        run: |
          # Глоб тригера ширший за формат релізу: тег на кшталт
          # okaycms-fork/v1.0.0-rc1 зібрався б і опублікувався, але
          # клієнтський фільтр (спек §2) його ніколи не побачить.
          # Падаємо раніше збірки.
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/okaycms-fork/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег '$GITHUB_REF' не відповідає формату okaycms-fork/vX.Y.Z"
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/okaycms-fork/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        run: |
          # Реліз збирається лише з коміта, що вже влитий у main —
          # тег на довільній гілці не має стати публічним пакетом.
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Коміт тегу не досяжний з main — реліз можливий лише з main"
            exit 1
          fi

      - name: Verify Config::$forkVersion matches the tag
        run: |
          # Версія в пакеті живе у самому Config.php — якщо release-PR
          # забув бампнути forkVersion, пакет v1.1.0 поїхав би зі старою
          # версією всередині, і health-check апдейтера завалив би кожне
          # оновлення на цю версію. Ловимо до збірки.
          # vendor/ на цьому кроці ще не встановлений, тож без autoload -
          # читаємо оголошення властивості з файла напряму.
          PACKAGED="$(grep -oP "forkVersion\s*=\s*'\K[0-9]+\.[0-9]+\.[0-9]+" Okay/Core/Config.php || true)"
          if [[ "$PACKAGED" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Config::\$forkVersion ('$PACKAGED') не збігається з тегом ('${{ steps.version.outputs.version }}') — release-PR мусить бампнути версію"
            exit 1
          fi

      - name: Verify version is monotonically newer
        run: |
          # Страхує ручний шлях (тег, поставлений адміном повз tag-release):
          # версія нижча за вже опубліковану не має стати релізом — клієнтський
          # фільтр "остання версія" її ніколи не покаже, а стеля лишиться.
          VERSION="${{ steps.version.outputs.version }}"
          LATEST_OTHER="$(git tag --list 'okaycms-fork/v*' \
            | sed 's|^okaycms-fork/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$VERSION" | sort -V | tail -1)"

          if [[ -n "$LATEST_OTHER" ]]; then
            HIGHEST="$(printf '%s\n%s\n' "$VERSION" "$LATEST_OTHER" | sort -V | tail -1)"
            if [[ "$HIGHEST" != "$VERSION" ]]; then
              echo "::error::Версія $VERSION нижча за вже існуючу $LATEST_OTHER — downgrade-реліз заборонено"
              exit 1
            fi
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: simplexml, xmlreader, pdo, json, curl, mbstring, zip, gd, xsl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build release package
        run: php ok release:build-package --fork-version="${{ steps.version.outputs.version }}" --output-dir=build/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="okaycms-fork/v${VERSION}"
          ASSETS=(
            "build/release/okaycms-fork-v${VERSION}.zip"
            "build/release/version.json"
            "build/release/checksums.txt"
          )

          # Нотатки: від попереднього тегу форку. Без цього GitHub узяв би
          # за старт найближчий апстрімний тег (4.5.2) і перший реліз
          # отримав би нотатки на весь розрив форку з апстрімом.
          PREV="$(git tag --list 'okaycms-fork/v*' | grep -vxF "$TAG" | sort -V | tail -1)"
          if [[ -n "$PREV" ]]; then
            NOTES_ARGS=(--generate-notes --notes-start-tag "$PREV")
          else
            NOTES_ARGS=(--notes "Перший публічний реліз форку OkayCMS (base: OkayCMS 4.5.2).")
          fi

          # Ідемпотентність: ре-ран після збою завантаження asset'а не має
          # падати на "release already exists".
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            gh release create "$TAG" \
              --title "OkayCMS Fork v${VERSION}" \
              "${NOTES_ARGS[@]}" \
              "${ASSETS[@]}"
          fi
