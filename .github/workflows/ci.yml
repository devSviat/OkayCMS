name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Жодна джоба нічого не пише: тести, аналізатори й скан секретів лише читають
# дерево. Без цього блоку токен отримує типові права репозиторію.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: simplexml, xmlreader, pdo, json, curl, mbstring, zip, gd, xsl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # --abandoned=report, а не fail: покинутий пакет вимагає рішення, а не
      # зупинки збірки в день, коли автор поставив прапорець.
      - name: Composer audit
        run: composer audit --locked --abandoned=report

      - name: PHPUnit
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan (PHP 8.5)
    steps:
      - uses: actions/checkout@v7

      # PHPStan analysis is sensitive to the runtime PHP version and its
      # baseline was generated on 8.5, so it runs on a single version to avoid
      # baseline drift across the matrix.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: simplexml, xmlreader, pdo, json, curl, mbstring, zip, gd, xsl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      # PHPStan рахує нижньою межею 8.4 з composer.json і не бачить того, що
      # застаріло лише в 8.5, як касти (integer). Компілятор 8.5 бачить, у
      # кожному файлі, зокрема в tests/ і ok, яких PHPStan не аналізує.
      - name: Застаріле в PHP 8.5
        run: |
          set -o pipefail
          git ls-files -z -- '*.php' ok ':!:Okay/Modules/*/vendor/*' \
            | xargs -0 -n 100 -P 4 php -d error_reporting=-1 -d display_errors=1 -d log_errors=0 -l 2>&1 \
            | { grep -v '^No syntax errors detected in ' || true; } | tee lint.txt
          test ! -s lint.txt

  secrets:
    runs-on: ubuntu-latest
    name: Gitleaks
    steps:
      # Уся історія: прибраний наступним комітом секрет лишається чинним.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Бінарник з релізу, а не сторонній action: цьому кроку не потрібен
      # доступ до токена збірки.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "/tmp/${archive}" "${base}/${archive}"
          curl -fsSL -o /tmp/checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd /tmp && grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose
  smoke:
    runs-on: ubuntu-latest
    name: Smoke (Docker)
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: simplexml, xmlreader, pdo, json, curl, mbstring, zip, gd, xsl
          coverage: none
          tools: composer:v2

      # vendor/ монтується в контейнер із робочого дерева, тож ставиться тут.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # APP_UID/APP_GID беруться з раннера, а не з прикладу: під чужим uid
      # контейнер не запише в compiled/ і cache/, і магазин віддасть 500.
      - name: Prepare the environment
        run: |
          set -euo pipefail
          cp config/config.local-example.php config/config.local.php
          cp dev/.env-example dev/.env
          sed -i "s/^APP_UID=.*/APP_UID=$(id -u)/" dev/.env
          sed -i "s/^APP_GID=.*/APP_GID=$(id -g)/" dev/.env

      - name: Start the stack
        working-directory: dev
        run: docker compose up -d --build

      - name: Smoke checks
        run: dev/bin/smoke.sh

      - name: Container logs on failure
        if: failure()
        working-directory: dev
        run: docker compose logs --tail 200
