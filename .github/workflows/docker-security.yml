# Сканує зібрані прод-образи на CVE. Окремий від ci.yml, бо має власний
# schedule, а ci.yml лишається швидким і без Docker.
#
# Сканується зібраний образ, а не базовий тег: composer-залежності з vendor/
# потрапляють у той самий прогін, що й Debian-пакети.
#
# SARIF у code scanning не вивантажується — для одного мейнтейнера він дублює
# лист про впалий прогін за розкладом.
#
# На PR не запускається навмисно: білд образу додавав би ~2 хв до 50-секундного
# ci.yml. Знахідка спливе на push у main або в тижневому прогоні — перевірити
# гілку до мерджу можна вручну через Run workflow.
name: Docker security

on:
  push:
    branches: [ main ]
  schedule:
    # Нові CVE з'являються без наших комітів. Хвилина зсунута від нуля: cron'и
    # на рівну годину GitHub ставить у спільну чергу.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Trivy (prod images)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Обидва образи в одній джобі: nginx-prod — це COPY поверх alpine, майже
      # безкоштовний після першого білду.
      #
      # no-cache за розкладом: інакше шар apt-get upgrade лишається замороженим
      # і тижневий скан дивиться на той самий образ, що й минулого тижня.
      - name: Build the prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/docker/Dockerfile
          target: prod
          tags: okaycms:ci
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the nginx-prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/docker/Dockerfile
          target: nginx-prod
          tags: okaycms-nginx:ci
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: CVE без патча в апстрімі полагодити нічим, а постійно
      # червоний CI привчає ігнорувати червоне.
      - name: Trivy gate (app image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: okaycms:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      # always() — щоб падіння по app-образу не ховало результат по nginx.
      - name: Trivy gate (nginx image)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: okaycms-nginx:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
