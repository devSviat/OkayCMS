# Сканує зібраний прод-образ на CVE. Окремий від ci.yml, бо має власний
# schedule, а ci.yml лишається швидким і без Docker.
#
# Сканується зібраний образ, а не базовий тег: composer-залежності з vendor/
# потрапляють у той самий прогін, що й Debian-пакети.
#
# SARIF у code scanning не вивантажується — для одного мейнтейнера він дублює
# лист про впалий прогін за розкладом.
#
# На PR не запускається навмисно: білд образу додавав би ~2 хв до 50-секундного
# ci.yml. Знахідка спливе на push у main або в тижневому прогоні — перевірити
# гілку до мерджу можна вручну через Run workflow.
name: Docker security

on:
  push:
    branches: [ main ]
  schedule:
    # Нові CVE з'являються без наших комітів. Хвилина зсунута від нуля: cron'и
    # на рівну годину GitHub ставить у спільну чергу.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Trivy (prod image)
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Образ один: вебсервер і PHP — той самий процес (FrankenPHP), окремої
      # стадії під nginx більше немає.
      #
      # no-cache завжди, а не лише за розкладом. Перший шар Dockerfile —
      # apt-get upgrade, і з кешу він приїздить із пакетами того дня, коли його
      # зібрали вперше. Скан тоді дивиться на заморожений образ і валиться на
      # CVE, які свіжий білд уже закриває: так сталось із CVE-2026-64561 у
      # linux-libc-dev, де база несе 6.12.100-1, а apt-get upgrade ставить
      # 6.12.101-1. Сенс цього воркфлоу — знати стан образу, який зібрався б
      # зараз, тож кеш тут шкодить. Ціна — кілька хвилин; на PR він не бігає.
      - name: Build the prod image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/docker/Dockerfile
          target: prod
          tags: okaycms:ci
          load: true
          pull: true
          no-cache: true

      # ignore-unfixed: CVE без патча в апстрімі полагодити нічим, а постійно
      # червоний CI привчає ігнорувати червоне.
      - name: Trivy gate (app image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: okaycms:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
