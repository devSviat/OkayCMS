# Сканування зібраних прод-образів на відомі CVE.
#
# Окремий workflow, а не джоба в ci.yml: у нього власний тригер `schedule`, а
# ci.yml має лишатись швидким (~50 с) і без залежності від Docker.
#
# Скануються саме зібрані образи, а не базові теги: стадія `prod` доліплює до
# php:8.5-fpm apt-пакети, supercronic і `composer install --no-dev`, тож
# сканування самого php:8.5-fpm показало б лише частину того, що їде в прод.
# Composer-залежності окремим кроком не скануються — vendor/ ставиться
# всередині білду (vendor у .dockerignore), і Trivy розбирає
# vendor/composer/installed.json тим самим прогоном, що й Debian-пакети.
#
# SARIF у GitHub code scanning тут свідомо не вивантажується. Репозиторій
# публічний, тож функція доступна, але для одного мейнтейнера вона дублює те,
# що й так приходить: GitHub шле лист про впалий прогін за розкладом. Кроки
# github/codeql-action/upload-sarif і permissions: security-events: write
# додаються пізніше в кілька рядків, якщо знадобиться історія алертів.
name: Docker security

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Нові CVE проти незмінного php:8.5-fpm з'являються без наших комітів, тож
    # без розкладу ми дізнавались би про них лише випадково. Хвилина зсунута
    # від нуля: cron'и на рівну годину GitHub ставить у спільну чергу.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Trivy (prod images)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Обидва образи збираються в одній джобі: nginx-prod — це COPY --from=prod
      # поверх alpine, тобто майже безкоштовний після першого білду. Дві
      # паралельні джоби збирали б важку стадію `base` двічі.
      #
      # no-cache на прогонах за розкладом — суть цього тригера. Шар
      # `apt-get upgrade` у стадії base кешується, і з теплим кешем тижневий
      # прогін пересканував би той самий образ, що й минулого тижня, тобто
      # ніколи не побачив би нових security-оновлень Debian. pull: true оновлює
      # лише базовий тег і від цього не рятує.
      - name: Build the prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/docker/Dockerfile
          target: prod
          tags: okaycms:ci
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the nginx-prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/docker/Dockerfile
          target: nginx-prod
          tags: okaycms-nginx:ci
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: базовий Debian везе десятки CVE, для яких апстрім не
      # випустив виправлення. Падати на них означало б тримати CI постійно
      # червоним без жодної дії, якою це можна полагодити — і привчити
      # ігнорувати червоне. Те, що виправлення вже є, ловиться саме тут:
      # `apt-get upgrade` у стадії base його підтягує, а гейт перевіряє, що
      # підтягнув усе.
      - name: Trivy gate (app image)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: okaycms:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      # if: always() — щоб падіння по app-образу не ховало результат по nginx:
      # інакше з двох проблем видно було б лише одну, і полагодження йшло б по
      # одній ітерації CI на образ.
      - name: Trivy gate (nginx image)
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: okaycms-nginx:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
