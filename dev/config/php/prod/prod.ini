; PHP-налаштування лише для prod, копіюються у stage `prod`.
; У dev-образі цього файлу немає, а dev.ini немає тут.

error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off

; Файли коду всередині образу не змінюються, тож перевірка timestamp — чиста
; накладна витрата.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
