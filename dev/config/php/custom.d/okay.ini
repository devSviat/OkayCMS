; Налаштування, спільні для кожного контейнера OkayCMS, dev і prod.
; Завантажується з /usr/local/etc/php/custom.d, доданого до PHP_INI_SCAN_DIR
; поверх штатного conf.d образу — тож docker-php-ext-*.ini лишаються на місці.

date.timezone = Europe/Kyiv

; Помилки логуються, а не друкуються. Для веб-запитів OkayCMS сама вимикає
; display_errors у index.php:14 ще до старту, і вмикає назад лише в
; debug_mode — цей рядок стосується ./ok CLI, PHPUnit і збоїв до бутстрапу.
display_errors = Off
log_errors = On

; X-Powered-By з точною версією PHP у кожній відповіді. nginx її ще й ховає
; через fastcgi_hide_header — але на чужому хостингу конфіг може бути інший,
; тож джерело вимикається тут.
expose_php = Off

; error_log навмисно не задано: образ php:fpm вже спрямовує лог FPM у
; /proc/self/fd/2 (catch_workers_output = yes), тож він і так потрапляє в
; `docker compose logs`. CLI використовує stderr.

memory_limit = 1024M
max_execution_time = 18000

upload_max_filesize = 1000M
post_max_size = 1000M
