; Клієнтські налаштування Xdebug 3. Сам режим береться зі змінної XDEBUG_MODE
; у docker-compose.override.yml, яка має пріоритет над ini і змінюється без
; перезбирання образу.
;
; Рядка `zend_extension = xdebug` тут навмисно немає: install-php-extensions
; вже пише conf.d/docker-php-ext-xdebug.ini, і conf.d більше не перекритий.

xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9001
xdebug.log = /tmp/xdebug.log
