; PHP-налаштування лише для dev, копіюються у stage `dev`.
; Prod-образ цього файлу не містить узагалі, тож у нього ці налаштування не
; потраплять.

error_reporting = E_ALL
display_errors = On

; mail() спрямовується в Mailpit. Гілка SMTP() в Okay/Core/Notify.php
; перенаправляється окремо через ok_settings — див. dev/config/mysql/db-init.sh.
sendmail_path = "/usr/bin/msmtp --host=mailpit --port=1025 --tls=off --auth=off --from=okaycms@localhost -t"
