; Рядок обов'язковий: volume ./config/php перекриває conf.d образу і ховає
; згенерований docker-php-ext-xdebug.ini, тож без нього Xdebug не завантажиться.
zend_extension = xdebug

; Конфіг для Xdebug 3 (PHP 8.x). Параметри remote_* з Xdebug 2 більше не діють.
[xdebug]
xdebug.mode = debug
; Дебаг лише за тригером (cookie/GET XDEBUG_TRIGGER або розширення браузера) —
; без накладних витрат і спроб під'єднання на кожному запиті.
xdebug.start_with_request = trigger
; Примітка: у WSL2/Docker Desktop host.docker.internal може резолвитись у
; недосяжний IPv6 ("Network is unreachable"). Якщо дебаг не під'єднується —
; локально заміни на IPv4-адресу хоста (напр. шлюз Docker Desktop 192.168.65.254).
xdebug.client_host = host.docker.internal
xdebug.client_port = 9001
xdebug.log = /tmp/xdebug.log
