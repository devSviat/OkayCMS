; Для активації Xdebug розкоментуйте цей параметр
zend_extension = xdebug

; Конфіг для Xdebug 3 (PHP 8.x). У Xdebug 3 параметри remote_* більше не діють:
; remote_enable    -> mode=debug
; remote_host      -> client_host
; remote_port      -> client_port
; remote_log       -> log
; remote_autostart -> start_with_request=yes
[xdebug]
xdebug.mode = debug
xdebug.client_host = host.docker.internal
xdebug.client_port = 9001
xdebug.log = /tmp/xdebug.log
xdebug.start_with_request = yes
