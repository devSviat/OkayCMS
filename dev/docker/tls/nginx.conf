# TLS-проксі для локального HTTPS (сервіс `tls`, профіль `tls`). TLS знімається
# тут, далі запит іде в основний nginx по HTTP; ядро бачить https через
# X-Forwarded-Proto.
events {}

http {
    server_tokens off;

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # mkcert-сертифікат під VIRTUAL_HOST; імена фіксовані, щоб конфіг не
        # залежав від домену.
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Той самий ліміт, що в основному nginx, інакше завантаження відсіклися б тут.
        client_max_body_size 100M;

        location / {
            proxy_pass http://nginx:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
