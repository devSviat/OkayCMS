# Production-оверлей поверх docker-compose.yml, вмикається явно. Не публікує
# жодного порту: PaaS підключає власний проксі прямо до контейнера. Порти —
# лише в docker-compose.standalone.yml. Деталі деплою — dev/README.md.

x-php-build-prod: &php-build-prod
  context: ..
  dockerfile: dev/docker/Dockerfile
  target: prod
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-prod-limits: &prod-limits
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "${PROD_CPU_LIMIT:-1.0}"
        memory: "${PROD_MEM_LIMIT:-512M}"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  php85:
    <<: *prod-limits
    # `build` — для PaaS, що збирає з репозиторію. Для готового образу з
    # реєстру задайте APP_IMAGE/APP_IMAGE_TAG і APP_PULL_POLICY=always.
    # Дефолт `latest` — щоб перший деплой не падав; production має виставити
    # незмінний тег, інакше неможливо відкотитись.
    build: *php-build-prod
    image: ${APP_IMAGE:-okaycms}:${APP_IMAGE_TAG:-latest}
    pull_policy: ${APP_PULL_POLICY:-build}
    volumes:
      # Конфіг рантайму з паролем БД приходить ззовні, а не запікається в образ
      # (шаблон: config/config.local-example.php). create_host_path: false —
      # щоб при відсутньому файлі деплой упав, а не отримав теку від Docker'а.
      - type: bind
        source: ../config/config.local.php
        target: /var/www/html/config/config.local.php
        read_only: true
        bind:
          create_host_path: false
    # Тепер трафік приймає цей сервіс, а не окремий nginx. Приклад форми міток
    # Traefik для звірки з робочим стеком — не заготовка для розкоментування.
    # PaaS підставляє свої сам.
    #
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.<paas-generated-name>.rule: Host(`example.com`)
    #   traefik.http.routers.<paas-generated-name>.entrypoints: websecure
    #   traefik.http.routers.<paas-generated-name>.tls.certresolver: letsencrypt
    #   traefik.http.services.<paas-generated-name>.loadbalancer.server.port: "8080"

  scheduler:
    <<: *prod-limits
    build: *php-build-prod
    image: ${APP_IMAGE:-okaycms}:${APP_IMAGE_TAG:-latest}
    pull_policy: ${APP_PULL_POLICY:-build}
    volumes:
      - type: bind
        source: ../config/config.local.php
        target: /var/www/html/config/config.local.php
        read_only: true
        bind:
          create_host_path: false

  mariadb:
    <<: *prod-limits
    # Портів і мережевих правок тут немає навмисно — базовий файл уже лишає
    # mariadb неопублікованою і лише в internal-мережі. Паролі захищені правами
    # доступу на хості: chmod 600 на .env і config.local.php.
