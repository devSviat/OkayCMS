# Production overlay — opt-in only, layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The single biggest difference from the dev override: this file publishes
# NO ports on ANY service. Dokploy attaches its own Traefik instance directly
# to the container it is told to route to, so a host port publication here
# would be redundant at best and a stray extra attack surface at worst. The
# one place a production deployment is allowed to publish a port is
# docker-compose.standalone.yml, and only for hosts that have no Dokploy (or
# equivalent reverse proxy) in front at all.
#
# Mailpit is dev-only and lives solely in docker-compose.override.yml, which
# this overlay never touches — it cannot leak in here. Confirmed while writing
# this file: `docker compose -f docker-compose.yml -f docker-compose.prod.yml
# config` lists no mailpit service.

# Shared by php85 and scheduler, same reasoning as the base file's
# x-php-build/x-php-env: one definition so the two images cannot drift apart.
x-php-build-prod: &php-build-prod
  context: ..
  dockerfile: dev/docker/Dockerfile
  target: prod
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

# restart/resources/logging are identical across every service in this file,
# so they live in one anchor rather than four copy-pasted blocks.
x-prod-limits: &prod-limits
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "${PROD_CPU_LIMIT:-1.0}"
        memory: "${PROD_MEM_LIMIT:-512M}"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  php85:
    <<: *prod-limits
    # Two ways to end up with the prod image, matching two different
    # deployment shapes:
    #   - Dokploy building straight from this git repo: `build` below wins
    #     (target: prod), and the `image:` line is just the tag it gets built
    #     as.
    #   - A pre-built image from a registry, produced by CI elsewhere: point
    #     OKAY_IMAGE at that registry path, set OKAY_VERSION to a real tag,
    #     and set OKAY_PULL_POLICY=always so Compose pulls instead of
    #     building.
    #
    # The version variable's default is `latest`, deliberately NOT
    # `${OKAY_VERSION:?err}`. A required-with-no-default variable looks like
    # the more careful choice for a production file, but it means the very
    # first Dokploy redeploy — before anyone has had the chance to open its
    # environment-variables UI and type OKAY_VERSION in — fails outright with
    # no container to even show the error in. `:-latest` at least boots.
    # The opposite failure mode is just as real, though: a production stack
    # that silently tracks `:latest` forever has no record of which commit is
    # actually running, and a bad push takes prod down on the next redeploy
    # with no version to roll back to by name. Splitting the difference
    # honestly: this file defaults to `latest` so it is never dead on
    # arrival, but the Dokploy prod environment MUST set OKAY_VERSION
    # explicitly to a real, immutable tag — that requirement belongs in the
    # deployment runbook, not buried only in this comment.
    build: *php-build-prod
    image: ${OKAY_IMAGE:-okaycms}:${OKAY_VERSION:-latest}
    pull_policy: ${OKAY_PULL_POLICY:-build}
    volumes:
      # The runtime config — including the application's own DB
      # password — comes from outside the image, never baked in. See
      # config/config.local.prod-example.php for the template and the
      # comments in this file's `mariadb.environment` block for what this
      # file's own secrets handling does and does not cover.
      - '../config/config.local.prod.php:/var/www/html/config/config.local.php:ro'

  # Same image, same reasoning, as php85 — see the base file's `scheduler`
  # service for why this exists at all (nothing ran `./ok scheduler:run`
  # before it).
  scheduler:
    <<: *prod-limits
    build: *php-build-prod
    image: ${OKAY_IMAGE:-okaycms}:${OKAY_VERSION:-latest}
    pull_policy: ${OKAY_PULL_POLICY:-build}
    volumes:
      - '../config/config.local.prod.php:/var/www/html/config/config.local.php:ro'

  nginx:
    <<: *prod-limits
    # Without this, nginx inherits the base file's plain `image:
    # nginx:1.29-alpine` and /var/www/html stays empty — every request 404s,
    # because the base file's application bind mount lives only in
    # docker-compose.override.yml (dev-only). nginx-prod
    # (dev/docker/Dockerfile) COPYs the same tree the `prod` target just built
    # and composer-installed, so static assets can never drift out of sync
    # with the PHP image — both come from the identical build context/args.
    build:
      context: ..
      dockerfile: dev/docker/Dockerfile
      target: nginx-prod
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ${OKAY_NGINX_IMAGE:-okaycms-nginx}:${OKAY_VERSION:-latest}
    pull_policy: ${OKAY_PULL_POLICY:-build}
    volumes:
      # The image only carries what was committed at build time. Everything
      # OkayCMS writes at runtime — product/upload images (files,
      # backend_files) and compiled CSS/JS (app_cache; see
      # Okay/Core/config/parameters.php's compile_css_dir/compile_js_dir) —
      # must be mounted here too, read-only, or it 404s even after the fix
      # above. Same named volumes php85/scheduler already write into.
      - files:/var/www/html/files:ro
      - backend_files:/var/www/html/backend/files:ro
      - app_cache:/var/www/html/cache:ro
    # --- Traefik ---
    # Dokploy generates and injects its own Traefik labels onto whichever
    # service/container it is pointed at (normally this one), and it also
    # generates the router/service names itself — those are not ours to
    # invent. The block below exists only to document the *shape* Dokploy's
    # labels take, for anyone comparing a running stack against this file;
    # see devSviat/broken for what Dokploy actually generated there. Do not
    # uncomment this as-is — `<dokploy-generated-name>` is not a blank for us
    # to fill in with a name of our choosing.
    #
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.<dokploy-generated-name>.rule: Host(`example.com`)
    #   traefik.http.routers.<dokploy-generated-name>.entrypoints: websecure
    #   traefik.http.routers.<dokploy-generated-name>.tls.certresolver: letsencrypt
    #   traefik.http.services.<dokploy-generated-name>.loadbalancer.server.port: "80"

  mariadb:
    <<: *prod-limits
    # No `ports:` override here, or anywhere else in this file — the base
    # file already leaves mariadb unpublished and on the internal `backend`
    # network only; there is nothing to change.
    #
    # Docker secrets, `*_FILE` convention: the mariadb image reads
    # MYSQL_ROOT_PASSWORD_FILE / MYSQL_PASSWORD_FILE (a path) in preference to
    # MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD (the value itself) if both kinds
    # are present it refuses to start — so the plain-value keys must not
    # reach the container at all.
    #
    # The base file keeps `${MYSQL_ROOT_PASSWORD:?err}` / `${MYSQL_PASSWORD:?err}`
    # so `docker compose config` still fails loudly if a deploy forgot to set
    # *something* there — that's a good guard rail to keep. To satisfy it
    # without leaking a real password, set both to any non-empty placeholder
    # in the Dokploy environment panel (its actual text is irrelevant and
    # never used). `!reset null` below then deletes that key again before the
    # merged config reaches the container, so the placeholder never shows up
    # in `docker inspect` either — only the *_FILE path does, and a path is
    # not a secret.
    #
    # Plain Compose, not Swarm: `secrets:` with a `file:` source (below) works
    # fine outside Swarm mode; nothing here requires `docker stack deploy`.
    #
    # What this actually protects, stated plainly: MariaDB's own root and app
    # credentials, so they no longer show up in `docker inspect`. It does NOT
    # protect the application's own database password — OkayCMS reads that
    # from config/config.local.php, never from the environment, so no
    # environment-variable or Docker-secrets trick touches it either way. For
    # that file the guidance is chmod 600, owned by the deploy user, mounted
    # read-only (see php85/scheduler above), and excluded from the build
    # context (already done — see the root .dockerignore, verified by
    # dev/bin/smoke-prod.sh).
    environment:
      MYSQL_ROOT_PASSWORD: !reset null
      MYSQL_PASSWORD: !reset null
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password

secrets:
  # `file:` sources — the actual secret files live at dev/secrets/*.txt,
  # gitignored (dev/.gitignore); only the *.example templates are tracked.
  # Create the real files locally/on the deploy host before `up`:
  #   cp secrets/mysql_root_password.txt.example secrets/mysql_root_password.txt
  #   cp secrets/mysql_password.txt.example       secrets/mysql_password.txt
  #   $EDITOR secrets/*.txt   # then chmod 600 secrets/*.txt
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
