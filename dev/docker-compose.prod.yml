# Production overlay — opt-in only, layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The single biggest difference from the dev override: this file publishes
# NO ports on ANY service. A PaaS like Dokploy or Coolify attaches its own
# proxy (Traefik in both cases) directly to the container it routes to, so a
# host port publication here would be redundant at best and a stray extra
# attack surface at worst. The one place a production deployment is allowed
# to publish a port is docker-compose.standalone.yml, and only for hosts with
# no such proxy in front at all.
#
# Mailpit is dev-only and lives solely in docker-compose.override.yml, which
# this overlay never touches — it cannot leak in here. Confirmed while writing
# this file: `docker compose -f docker-compose.yml -f docker-compose.prod.yml
# config` lists no mailpit service.

# Shared by php85 and scheduler, same reasoning as the base file's
# x-php-build/x-php-env: one definition so the two images cannot drift apart.
x-php-build-prod: &php-build-prod
  context: ..
  dockerfile: dev/docker/Dockerfile
  target: prod
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

# restart/resources/logging are identical across every service in this file,
# so they live in one anchor rather than four copy-pasted blocks.
x-prod-limits: &prod-limits
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "${PROD_CPU_LIMIT:-1.0}"
        memory: "${PROD_MEM_LIMIT:-512M}"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  php85:
    <<: *prod-limits
    # Two ways to end up with the prod image, matching two different
    # deployment shapes:
    #   - A PaaS (Dokploy, Coolify, ...) building straight from this git repo:
    #     `build` below wins
    #     (target: prod), and the `image:` line is just the tag it gets built
    #     as.
    #   - A pre-built image from a registry, produced by CI elsewhere: point
    #     OKAY_IMAGE at that registry path, set OKAY_VERSION to a real tag,
    #     and set OKAY_PULL_POLICY=always so Compose pulls instead of
    #     building.
    #
    # The version variable's default is `latest`, deliberately NOT
    # `${OKAY_VERSION:?err}`. A required-with-no-default variable looks like
    # the more careful choice for a production file, but it means the very
    # first redeploy on a PaaS — before anyone has had the chance to open its
    # environment-variables UI and type OKAY_VERSION in — fails outright with
    # no container to even show the error in. `:-latest` at least boots.
    # The opposite failure mode is just as real, though: a production stack
    # that silently tracks `:latest` forever has no record of which commit is
    # actually running, and a bad push takes prod down on the next redeploy
    # with no version to roll back to by name. Splitting the difference
    # honestly: this file defaults to `latest` so it is never dead on
    # arrival, but the production environment MUST set OKAY_VERSION
    # explicitly to a real, immutable tag — that requirement belongs in the
    # deployment runbook, not buried only in this comment.
    build: *php-build-prod
    image: ${OKAY_IMAGE:-okaycms}:${OKAY_VERSION:-latest}
    pull_policy: ${OKAY_PULL_POLICY:-build}
    volumes:
      # The runtime config — including the application's own DB
      # password — comes from outside the image, never baked in. See
      # config/config.local.prod-example.php for the template and the
      # comments in this file's `mariadb` block for where the database
      # passwords come from and what actually guards them.
      # Довга форма заради create_host_path: false. Зі скороченою формою
      # Docker, не знайшовши файлу, мовчки створює на його місці ТЕКУ — і
      # застосунок падає незрозуміло, замість того щоб деплой зупинився з
      # ясною причиною. З цим прапорцем відсутній файл дає помилку одразу.
      - type: bind
        source: ../config/config.local.prod.php
        target: /var/www/html/config/config.local.php
        read_only: true
        bind:
          create_host_path: false

  # Same image, same reasoning, as php85 — see the base file's `scheduler`
  # service for why this exists at all (nothing ran `./ok scheduler:run`
  # before it).
  scheduler:
    <<: *prod-limits
    build: *php-build-prod
    image: ${OKAY_IMAGE:-okaycms}:${OKAY_VERSION:-latest}
    pull_policy: ${OKAY_PULL_POLICY:-build}
    volumes:
      # Довга форма заради create_host_path: false. Зі скороченою формою
      # Docker, не знайшовши файлу, мовчки створює на його місці ТЕКУ — і
      # застосунок падає незрозуміло, замість того щоб деплой зупинився з
      # ясною причиною. З цим прапорцем відсутній файл дає помилку одразу.
      - type: bind
        source: ../config/config.local.prod.php
        target: /var/www/html/config/config.local.php
        read_only: true
        bind:
          create_host_path: false

  nginx:
    <<: *prod-limits
    # Without this, nginx inherits the base file's plain `image:
    # nginx:1.29-alpine` and /var/www/html stays empty — every request 404s,
    # because the base file's application bind mount lives only in
    # docker-compose.override.yml (dev-only). nginx-prod
    # (dev/docker/Dockerfile) COPYs the same tree the `prod` target just built
    # and composer-installed, so static assets can never drift out of sync
    # with the PHP image — both come from the identical build context/args.
    build:
      context: ..
      dockerfile: dev/docker/Dockerfile
      target: nginx-prod
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ${OKAY_NGINX_IMAGE:-okaycms-nginx}:${OKAY_VERSION:-latest}
    pull_policy: ${OKAY_PULL_POLICY:-build}
    volumes:
      # The image only carries what was committed at build time. Everything
      # OkayCMS writes at runtime — product/upload images (files,
      # backend_files) and compiled CSS/JS (app_cache; see
      # Okay/Core/config/parameters.php's compile_css_dir/compile_js_dir) —
      # must be mounted here too, read-only, or it 404s even after the fix
      # above. Same named volumes php85/scheduler already write into.
      - files:/var/www/html/files:ro
      - backend_files:/var/www/html/backend/files:ro
      - app_cache:/var/www/html/cache:ro
    # --- Traefik ---
    # A PaaS such as Dokploy or Coolify generates and injects its own Traefik
    # labels onto whichever service/container it is pointed at (normally this
    # one), and generates the router/service names itself — those are not ours
    # to invent. The block below documents only the *shape* those labels take,
    # for anyone comparing a running stack against this file. Do not uncomment
    # it as-is: `<paas-generated-name>` is not a blank for us to fill in.
    #
    # If you drive Traefik yourself (no PaaS), you own these labels and the
    # external proxy network — add them here deliberately.
    #
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.<paas-generated-name>.rule: Host(`example.com`)
    #   traefik.http.routers.<paas-generated-name>.entrypoints: websecure
    #   traefik.http.routers.<paas-generated-name>.tls.certresolver: letsencrypt
    #   traefik.http.services.<paas-generated-name>.loadbalancer.server.port: "80"

  mariadb:
    <<: *prod-limits
    # Ні `ports:`, ні мережевих правок тут немає — базовий файл уже лишає
    # mariadb неопублікованою і лише в internal-мережі `backend`.
    #
    # Паролі беруться зі змінних оточення базового файлу
    # (${MYSQL_ROOT_PASSWORD:?err} / ${MYSQL_PASSWORD:?err}), тобто з `.env` на
    # хості або з панелі змінних вашої платформи розгортання.
    #
    # Тут раніше стояли Docker secrets із конвенцією *_FILE. Прибрано свідомо,
    # і ось чесний облік того, що це змінює.
    #
    # Що secrets давали: пароль БД не з'являвся у виводі `docker inspect`.
    # Що вони НЕ давали: захисту від того, хто вже має доступ до Docker —
    # `docker exec ... cat /run/secrets/mysql_password` читається так само
    # легко; група `docker` фактично дорівнює root на хості.
    # І головне: пароль, яким у базу ходить сам застосунок, однаково лежить
    # відкритим текстом у config/config.local.prod.php, бо OkayCMS читає його
    # звідти, а не з оточення. Механізм закривав одну дірку з двох, коштуючи
    # при цьому окремих файлів секретів, трюку `!reset null` і вимоги
    # виставляти фіктивне значення змінної, яке нікуди не йде.
    #
    # Отже реальна межа захисту тут — права доступу на хості: на `.env` і на
    # config/config.local.prod.php. Обидва мають бути chmod 600 і належати
    # користувачеві деплою. Пам'ятайте, що змінні оточення видно в
    # `docker inspect`, тож не вставляйте цей вивід у тікети й не збирайте
    # його моніторингом без фільтрації.
