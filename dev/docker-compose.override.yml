# Dev-оверрайди. Compose підключає цей файл сам, тож звичайний
# `docker compose up -d` уже дає dev-оточення. Особисті правки —
# у гітігнорований docker-compose.local.yml, підключати явно.

services:
  php85:
    environment:
      # Xdebug 3 читає цю змінну і вона важливіша за ini — режим перемикається
      # без перезбирання образу.
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      PHP_IDE_CONFIG: serverName=${VIRTUAL_HOST:?err}
    volumes:
      - '..:/var/www/html'
      # Іменований том поверх bind-mount перекриває його вміст, тож томи
      # базового файлу треба замінити bind'ами на ті самі цілі — інакше файли
      # робочого дерева невидимі в контейнері.
      - '../files:/var/www/html/files'
      - '../backend/files:/var/www/html/backend/files'
      - '../cache:/var/www/html/cache'
      - '../Okay/log:/var/www/html/Okay/log'
    # У dev ці теки лежать у робочому дереві з правильним власником. З tmpfs
    # теку теми створює перший процес, що звернувся — і якщо це root через
    # `exec`, php-fpm під www-data у неї вже не запише.
    tmpfs: !reset null
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Список має повністю збігатися з php85: обидва діляться якорем x-app-volumes,
  # тож неперевизначена тут ціль лишиться томом і перекриє робоче дерево.
  scheduler:
    volumes:
      - '..:/var/www/html'
      - '../files:/var/www/html/files'
      - '../backend/files:/var/www/html/backend/files'
      - '../cache:/var/www/html/cache'
      - '../Okay/log:/var/www/html/Okay/log'
    tmpfs: !reset null

  nginx:
    hostname: ${VIRTUAL_HOST:?err}
    ports:
      - '${BIND_IP:-127.0.0.1}:${HTTP_PORT:?err}:80'
    volumes:
      - '..:/var/www/html'

  mariadb:
    # У базовому файлі mariadb лише в internal-мережі, і опублікований порт там
    # нічого не дав би — Docker не створює NAT для контейнера без маршруту
    # назовні. У dev потрібен доступ із DBeaver, тож додається frontend.
    networks:
      - backend
      - frontend
    ports:
      - '${BIND_IP:-127.0.0.1}:${MYSQL_PORT:?err}:3306'
    volumes:
      - '../1DB_changes/okay_clean.sql:/docker-entrypoint-initdb.d/init.sql:ro'

  db-init:
    image: mariadb:10.11.18
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?err}
      DB_INIT_SMTP: ${DB_INIT_SMTP:-1}
    # Явно, бо мережі `default` тут немає: без цього сервіс опинився б в
    # автостворюваній `default`, ізольовано від mariadb.
    networks:
      - backend
    volumes:
      - './config/mysql/db-init.sh:/db-init.sh:ro'
    entrypoint: ["/bin/sh", "/db-init.sh"]

  mailpit:
    image: axllent/mailpit:v1.27.11
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      # Okay\Core\Notify завжди вмикає SMTPAuth, тож Mailpit має приймати AUTH
      # і на незахищеному з'єднанні. Обидва прапори dev-only.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - frontend
    ports:
      - '${BIND_IP:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025'
