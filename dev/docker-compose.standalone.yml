# Для звичайного хоста без PaaS чи проксі (Dokploy, Coolify, окремий Traefik),
# який сам приймає трафік ззовні. Додає єдине, що docker-compose.prod.yml
# навмисно не робить, — опублікований порт nginx, і більше нічого.
#
# Виклик (три файли саме в такому порядку — prod перед цим файлом, щоб
# `ports:` звідси ліг поверх того самого сервісу nginx):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.standalone.yml up -d
#
# Не підключайте цей файл, якщо проксі вже стоїть перед хостом: він і так
# ходить до nginx мережею `frontend`, а опублікований порт лише розширює
# поверхню контейнера без користі.

services:
  nginx:
    ports:
      # Дефолт тут 0.0.0.0, а не 127.0.0.1 як у dev-оверлеї, навмисно: цей файл
      # саме для хоста, який приймає трафік ззовні. 0.0.0.0 означає, що сайт
      # доступний на всіх інтерфейсах машини — попереду очікується firewall.
      # Для конкретного інтерфейсу задайте BIND_IP явно, напр. BIND_IP=10.0.0.5.
      - '${BIND_IP:-0.0.0.0}:${HTTP_PORT:?err}:80'
