# For a plain host with no Dokploy (or any other reverse proxy) attaching to
# the container automatically. Adds the one thing docker-compose.prod.yml
# deliberately omits — a published nginx port — and nothing else.
#
# Invocation (three files, in this order — prod first so this file's `ports:`
# lands on top of the same nginx service prod configures):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.standalone.yml up -d
#
# Do not add this file on top of a Dokploy deployment: Traefik reaches nginx
# over the `frontend` network directly, so a host-published port here does
# nothing for Dokploy and only widens the container's exposure for no benefit.

services:
  nginx:
    ports:
      # Дефолт тут 0.0.0.0, а не 127.0.0.1 як у dev-оверлеї, і це навмисно:
      # цей файл існує рівно для хоста, який сам приймає трафік ззовні. З
      # прив'язкою до петльового інтерфейсу він не робив би нічого корисного —
      # сайт був би недоступний саме там, де мав би працювати.
      #
      # Якщо треба вужче — задайте BIND_IP явно, наприклад BIND_IP=10.0.0.5
      # для конкретного інтерфейсу. Публікація на 0.0.0.0 означає, що сайт
      # доступний на всіх інтерфейсах машини; спереду очікується firewall.
      - '${BIND_IP:-0.0.0.0}:${HTTP_PORT:?err}:80'
