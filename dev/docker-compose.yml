# Базова конфігурація, спільна для dev і prod. Усе dev-специфічне —
# bind-mount'и коду, порти, Xdebug, сідовий дамп — у docker-compose.override.yml
# і в прод не потрапляє. Команди запуску — dev/README.md.

name: ${APP_NAME:?err}

# Спільне для php85 і scheduler, щоб образи й оточення не розійшлись.
x-php-build: &php-build
  context: ..
  dockerfile: dev/docker/Dockerfile
  target: dev
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-php-env: &php-env
  TZ: ${TZ:-Europe/Kyiv}
  TEST_INTERNAL_EMAIL: ${TEST_INTERNAL_EMAIL:-}
  PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-}

# Шляхи, у які OkayCMS пише під час роботи. Один якір на обидва сервіси —
# інакше ціль, не перевизначена для scheduler, губилась би при деплої.
x-app-volumes: &app-volumes
  - files:/var/www/html/files
  - backend_files:/var/www/html/backend/files
  - app_cache:/var/www/html/cache
  - app_log:/var/www/html/Okay/log

# Компільовані шаблони — кеш, що відновлюється сам. У tmpfs, щоб очищався при
# перестворенні контейнера й не ріс на диску.
x-app-tmpfs: &app-tmpfs
  - "/var/www/html/compiled:size=256m,uid=${APP_UID:-1000},gid=${APP_GID:-1000}"
  - "/var/www/html/backend/design/compiled:size=64m,uid=${APP_UID:-1000},gid=${APP_GID:-1000}"
  - "/var/www/html/Okay/xml/compiled:size=16m,uid=${APP_UID:-1000},gid=${APP_GID:-1000}"

services:
  php85:
    build: *php-build
    restart: unless-stopped
    environment:
      <<: *php-env
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes: *app-volumes
    tmpfs: *app-tmpfs
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # HTTP-запит, а не перевірка порту: FrankenPHP — це і вебсервер теж, тож
      # має сенс питати його те, що він реально віддає. robots.txt — статика з
      # білого списку, вона не тягне ні PHP, ні базу.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Запускає `./ok scheduler:run` за розкладом — див. docs/cli.md.
  scheduler:
    build: *php-build
    # tini — PID 1, обробляє сигнали й зомбі. -no-reap: tini вже це робить.
    # -passthrough-logs: вивід завдань іде в stdout, як у решти сервісів.
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["/usr/local/bin/supercronic", "-no-reap", "-passthrough-logs", "/etc/supercronic/crontab"]
    restart: unless-stopped
    # Той самий користувач, що й php-fpm: від root планувальник створював денний
    # лог під root, і вітрина вже не могла в нього дописати.
    user: www-data
    environment:
      <<: *php-env
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes: *app-volumes
    tmpfs: *app-tmpfs
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # Сервіс не слухає порт, тож перевіряється лише живий процес supercronic —
      # не успішність завдань. Для них: docker compose logs scheduler.
      test: ["CMD-SHELL", "pgrep -f supercronic >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mariadb:
    image: mariadb:10.11.18
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_USER: ${MYSQL_USER:-okay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?err}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?err}
    networks:
      # Лише backend: mariadb не має маршруту назовні з хоста.
      - backend
    volumes:
      - 'db_data:/var/lib/mysql'
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db_data:
  files:
  backend_files:
  app_cache:
  app_log:

networks:
  # Без явного `name:` навмисно: Compose додає префікс проєкту, інакше два
  # стеки з різними `-p` опинились би в одній мережі й бачили чужі контейнери.
  frontend:
  backend:
    internal: true
