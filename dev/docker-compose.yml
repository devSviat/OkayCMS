# Base configuration, shared by dev and prod.
#
#   dev   docker compose up -d                       (override.yml auto-loads)
#   prod  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Everything dev-specific — source bind mounts, published ports, Xdebug, the seed
# dump — lives in docker-compose.override.yml, so it cannot reach production.

name: ${APP_NAME:?err}

services:
  php85:
    build:
      context: ..
      dockerfile: dev/docker/Dockerfile
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      TEST_INTERNAL_EMAIL: ${TEST_INTERNAL_EMAIL:-}
      PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-}
    depends_on:
      mariadb:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # Opens the FastCGI port itself rather than just proving the CLI binary
      # runs — `php -r 'exit(0);'` passed even when php-fpm wasn't listening,
      # which is exactly the state nginx's depends_on is supposed to guard
      # against. The doubled $$ is required: Compose interpolates this string,
      # so a single $f would be swallowed before it ever reaches php.
      test: ["CMD-SHELL", "php -r '$$f=@fsockopen(\"127.0.0.1\", 9000); exit($$f ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      php85:
        condition: service_started
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      # Service DNS, not ${APP_NAME}-php85: the vhost no longer depends on the
      # project name, so `docker compose -p other-name up` works.
      FASTCGI: php85
      VIRTUAL_HOST: ${VIRTUAL_HOST:?err}
    volumes:
      - './config/nginx/templates:/etc/nginx/templates:ro'
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_USER: ${MYSQL_USER:-okay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?err}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?err}
    volumes:
      - 'db_data:/var/lib/mysql'
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db_data:

networks:
  default:
    name: ${NETWORK_NAME:?err}
