# Base configuration, shared by dev and prod.
#
#   dev   docker compose up -d                       (override.yml auto-loads)
#   prod  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Everything dev-specific — source bind mounts, published ports, Xdebug, the seed
# dump — lives in docker-compose.override.yml, so it cannot reach production.

name: ${APP_NAME:?err}

# Shared between php85 and the scheduler so the two cannot drift apart — same
# image, same build args.
x-php-build: &php-build
  context: ..
  dockerfile: dev/docker/Dockerfile
  target: dev
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

# Same idea for environment: php85 and the scheduler both run OkayCMS code
# and must see identical TZ/mail-redirect/domain settings.
x-php-env: &php-env
  TZ: ${TZ:-Europe/Kyiv}
  TEST_INTERNAL_EMAIL: ${TEST_INTERNAL_EMAIL:-}
  PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-}

# Шляхи, у які OkayCMS пише під час роботи. Спільні для php85 і scheduler —
# обидва крутять той самий код на тому ж образі, тож і писати можуть в те саме.
#
# Один якір, а не два списки, свідомо: раніше scheduler мав лише files та
# app_log, і завдання, яке згенерувало б експорт CSV чи компільований ассет,
# писало б у власний шар контейнера — невидимо для php85 і назавжди втрачено
# при наступному деплої. Копія списку розійшлася б знову; якір цього не дає.
x-app-volumes: &app-volumes
  - files:/var/www/html/files
  - backend_files:/var/www/html/backend/files
  - app_cache:/var/www/html/cache
  - app_log:/var/www/html/Okay/log

# Компільовані шаблони Smarty та XML: чистий кеш, який відновлюється сам.
# У tmpfs, щоб очищався при кожному перестворенні контейнера й не ріс на диску.
x-app-tmpfs: &app-tmpfs
  - "/var/www/html/compiled:size=256m,uid=${APP_UID:-1000},gid=${APP_GID:-1000}"
  - "/var/www/html/backend/design/compiled:size=64m,uid=${APP_UID:-1000},gid=${APP_GID:-1000}"
  - "/var/www/html/Okay/xml/compiled:size=16m,uid=${APP_UID:-1000},gid=${APP_GID:-1000}"

services:
  php85:
    build: *php-build
    restart: unless-stopped
    environment:
      <<: *php-env
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend
    # Шляхи, у які OkayCMS пише під час роботи, тож вони мають пережити
    # перестворення контейнера й деплой. У dev docker-compose.override.yml
    # монтує весь репозиторій у /var/www/html і перевизначає bind'и на тих
    # самих цілях — інакше ці іменовані томи перекрили б відповідні теки
    # робочого дерева й сховали завантаження від розробника. Докладніше — в
    # коментарі до php85 у самому override-файлі.
    volumes: *app-volumes
    tmpfs: *app-tmpfs
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # Opens the FastCGI port itself rather than just proving the CLI binary
      # runs — `php -r 'exit(0);'` passed even when php-fpm wasn't listening,
      # which is exactly the state nginx's depends_on is supposed to guard
      # against. The doubled $$ is required: Compose interpolates this string,
      # so a single $f would be swallowed before it ever reaches php.
      test: ["CMD-SHELL", "php -r '$$f=@fsockopen(\"127.0.0.1\", 9000); exit($$f ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Runs `./ok scheduler:run` on a schedule so registered tasks (see
  # docs/scheduler.md) actually fire — nothing did before this service existed.
  scheduler:
    build: *php-build
    # tini is PID 1 so signals/zombies are handled correctly; supercronic is
    # the cron daemon. -no-reap: tini already reaps, supercronic doesn't need
    # to as well. -passthrough-logs: job output goes straight to our stdout/
    # stderr instead of being wrapped in supercronic's own log lines, so
    # `docker compose logs scheduler` reads like every other service's logs.
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["/usr/local/bin/supercronic", "-no-reap", "-passthrough-logs", "/etc/supercronic/crontab"]
    restart: unless-stopped
    environment:
      <<: *php-env
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes: *app-volumes
    tmpfs: *app-tmpfs
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # This service never listens on 9000, so the image's default php-fpm
      # healthcheck cannot apply and must be overridden. pgrep only proves the
      # supercronic process is alive under tini — it is NOT evidence that any
      # scheduled job has actually run or succeeded; check
      # `docker compose logs scheduler` (or Okay/log/scheduler/) for that.
      test: ["CMD-SHELL", "pgrep -f supercronic >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      php85:
        condition: service_started
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      # Service DNS, not ${APP_NAME}-php85: the vhost no longer depends on the
      # project name, so `docker compose -p other-name up` works.
      FASTCGI: php85
      VIRTUAL_HOST: ${VIRTUAL_HOST:?err}
    networks:
      - frontend
    volumes:
      - './config/nginx/templates:/etc/nginx/templates:ro'
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_USER: ${MYSQL_USER:-okay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?err}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?err}
    networks:
      # backend only: mariadb has no route off the host at all.
      - backend
    volumes:
      - 'db_data:/var/lib/mysql'
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db_data:
  files:
  backend_files:
  app_cache:
  app_log:

networks:
  # bridge (the default type): has a route off the host, so nginx can be
  # reached and php85/scheduler can make outbound calls (e.g. the
  # NovaposhtaCost module's scheduled API lookups).
  #
  # Імена мереж НЕ задаються явно. Compose сам додає префікс проєкту, тож
  # виходить <project>_frontend / <project>_backend.
  #
  # Раніше тут стояло `name: ${NETWORK_NAME}-frontend`. Фіксоване глобальне
  # ім'я ламає ізоляцію так само, як це робив container_name: два стеки цього
  # ж проєкту з різними -p опинялись в ОДНІЙ мережі. Наслідок спостерігався
  # наживо — prod-стек резолвив `mariadb` у контейнер бази з dev-оточення і
  # ходив у чужу базу. На спільному хості це означало б, що продакшн пише в
  # базу розробки.
  frontend:
  # internal: true means no default route out of this network at all — a
  # container with only this network cannot reach anything off the host,
  # which is exactly what mariadb needs.
  backend:
    internal: true
