# Конфіг Gitleaks: дефолтні правила + allowlist на тестові фікстури.
# generic-api-key спрацьовує на навмисно-ворожих фікстурах верифікації
# пакета (пара "шлях": "sha256-хеш" виглядає як key:secret) — це не
# секрети, а контрольні дані тестів.

[extend]
useDefault = true

[allowlist]
paths = [
    '''tests/.*/fixtures/.*''',
]
